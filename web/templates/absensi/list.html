{% extends 'guru_base.html' %}

{% block content %}

<h2>Data Absensi</h2>

<form method="GET" action="{% url 'tambah_absensi' %}" class="mb-3 d-flex gap-2 align-items-end">
    <div>
        <label class="form-label mb-1">Mata Pelajaran</label>
        <input
            type="text"
            name="mata_pelajaran"
            class="form-control"
            placeholder="Contoh: Matematika"
            value="{{ request.GET.mata_pelajaran|default:'' }}"
        />
    </div>

    <button type="submit" class="btn btn-primary">
        Tambah Absensi
    </button>
</form>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Tanggal</th>
            <th>Nama Siswa</th>
            <th>Mata Pelajaran</th>
            <th>Status</th>
            <th>Keterangan</th>
            <th>Aksi</th>
        </tr>
    </thead>

    <tbody>
        {% for a in absensi %}
        <tr>
            <td>{{ a.tanggal }}</td>
            <td>{{ a.siswa.nama }}</td>
            <td>{{ a.mata_pelajaran }}</td>
            <td>{{ a.status }}</td>
            <td>{{ a.keterangan }}</td>

            <td>
                <a href="{% url 'edit_absensi' a.id %}" class="btn btn-warning btn-sm">Edit</a>
                <form method="POST" action="{% url 'hapus_absensi' a.id %}" style="display:inline;" onsubmit="return confirm('Yakin ingin menghapus?')">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
                </form>

            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
