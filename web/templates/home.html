{% extends 'base.html' %}

{% block content %}

<div class="text-center mb-5">
    <h1 class="fw-bold">🎓 Dashboard Sekolahku</h1>
    <p class="text-muted">
        Selamat datang di Sistem Informasi Sekolahku
    </p>
</div>

<div class="row">

    <!-- Card Guru -->
    <div class="col-md-6 mb-4">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <div class="mb-3">
                    <!-- Ikon pendidikan elegan -->
                    <i class="fas fa-book-open fa-3x text-primary"></i>
                </div>
                <h3 class="fw-bold">{{ total_guru }}</h3>
                <h5 class="text-muted">Total Guru</h5>
            </div>
        </div>
    </div>

    <!-- Card Siswa -->
    <div class="col-md-6 mb-4">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <div class="mb-3">
                    <!-- Ikon pendidikan elegan -->
                    <i class="fas fa-graduation-cap fa-3x text-success"></i>
                </div>
                <h3 class="fw-bold">{{ total_siswa }}</h3>
                <h5 class="text-muted">Total Siswa</h5>
            </div>
        </div>
    </div>

</div>

{% endblock %}
