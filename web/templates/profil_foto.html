{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="mb-3">Ubah Foto Profil</h3>
          <p class="text-muted mb-4">Pilih foto profil sesuai selera. Foto akan tersimpan dan ditampilkan di dashboard.</p>

          <div class="text-center mb-4">
            {% if foto_profil_url %}
              <img src="{{ foto_profil_url }}" alt="Foto Profil" width="120" height="120" style="object-fit:cover" class="rounded-circle shadow">
            {% else %}
              <div class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center" style="width:120px;height:120px;">
                <i class="bi bi-person" style="font-size:40px;color:#adb5bd"></i>
              </div>
            {% endif %}
          </div>

          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Simpan Foto</button>
          </form>

          <div class="mt-3">
            <a href="{{ back_url }}" class="btn btn-outline-secondary w-100">Kembali</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
